<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage Example</title>
</head>
<body>
    <h1>Local Storage Demo</h1>
    <input type="text" id="nameInput" placeholder="Enter name">
    <button id="saveBtn" onclick="saveItem()">Save Name</button>
    
    <button id="getBtn">Get Name</button>

    <button id="removeBtn" onclick="removeName()">Remove Name</button>

    <button id="clearBtn" onclick="clearAll()">Clear All</button>

    <h2 id="result"></h2>

    <script src="script.js"></script>
</body>
</html>
