<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Sign Up</h2>
    <form id="signUp">
        <input type="text" required id="email" placeholder="enter email">
        <p class="error error-message" id="emailError">Email is req</p>

        <input type="password" required id="password" placeholder="Enter password">
        <p class="error error-message" id="passwordError">password is req</p>
        
        <button type="submit" id="signUpBtn">Sign Up</button>
    </form>
    <script src="script.js"></script>
</body> 
</html>
